name: Bug Report
description: Report an issue or unexpected behavior in the GovGuide extension
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ CRITICAL PRIVACY REMINDER
        **DO NOT paste real personal data or screenshots showing Aadhaar, phone numbers, addresses, passwords, or OTPs.**
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: Which browser (Chrome/Edge/Brave) and operating system (Windows/macOS/Linux) are you using?
      placeholder: e.g. Chrome 124 on Windows 11
    validations:
      required: true
  - type: input
    id: portal_url
    attributes:
      label: Portal URL & Page
      description: What government page URL was active when the bug occurred?
      placeholder: e.g. https://sarathi.parivahan.gov.in/sarathiservice/stateSelection.do
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Tell us what should have happened.
    validations:
      required: true
