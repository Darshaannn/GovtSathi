name: Translation Correction
description: Suggest improvements or natural phrasing corrections for one of the supported languages
title: "[TRANSLATION]: "
labels: ["translation", "language-review"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: Which language are you reviewing or correcting?
      placeholder: e.g. Marathi (mr), Bengali (bn), Hindi (hi)
    validations:
      required: true
  - type: input
    id: guide_file
    attributes:
      label: Guide or UI File
      description: Where does this phrase appear?
      placeholder: e.g. guides/parivahan/sarathi-ll.json or engine/languages.js
    validations:
      required: true
  - type: textarea
    id: current_text
    attributes:
      label: Current Wording
      description: What is currently displayed or spoken?
    validations:
      required: true
  - type: textarea
    id: suggested_text
    attributes:
      label: Suggested Natural Indian Phrasing
      description: How should a native speaker phrase this so it sounds natural, respectful, and clear?
    validations:
      required: true
