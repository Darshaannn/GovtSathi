<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" id="govguide-mascot-svg-root">
  <defs>
    <!-- Soft drop shadow -->
    <filter id="mascot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Mascot Body (Friendly owl / bird companion) -->
  <g id="mascot-body-group" filter="url(#mascot-shadow)">
    <!-- Main round body -->
    <ellipse id="mascot-torso" cx="50" cy="54" rx="34" ry="36" fill="url(#bodyGrad)" />
    
    <!-- Ears / crest -->
    <polygon id="mascot-ear-left" points="26,24 38,34 22,38" fill="#1d4ed8" />
    <polygon id="mascot-ear-right" points="74,24 78,38 62,34" fill="#1d4ed8" />

    <!-- Belly -->
    <ellipse id="mascot-belly" cx="50" cy="62" rx="22" ry="24" fill="url(#bellyGrad)" />

    <!-- Eye Group Left -->
    <g id="mascot-eye-left-group">
      <!-- Outer eye -->
      <circle id="mascot-eye-white-l" cx="37" cy="46" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Left pupil -->
      <circle id="mascot-pupil-l" cx="39" cy="46" r="5.5" fill="#1e293b" />
      <!-- Left eye shine -->
      <circle id="mascot-shine-l" cx="41" cy="43.5" r="2" fill="#ffffff" />
      <!-- Left happy lid (hidden by default) -->
      <path id="mascot-happy-eye-l" d="M 28 47 Q 37 40 46 47" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" style="display:none;" />
      <!-- Left eyebrow -->
      <path id="mascot-brow-l" d="M 29 35 Q 37 34 45 35" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Eye Group Right -->
    <g id="mascot-eye-right-group">
      <!-- Outer eye -->
      <circle id="mascot-eye-white-r" cx="63" cy="46" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Right pupil -->
      <circle id="mascot-pupil-r" cx="65" cy="46" r="5.5" fill="#1e293b" />
      <!-- Right eye shine -->
      <circle id="mascot-shine-r" cx="67" cy="43.5" r="2" fill="#ffffff" />
      <!-- Right happy lid (hidden by default) -->
      <path id="mascot-happy-eye-r" d="M 54 47 Q 63 40 72 47" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" style="display:none;" />
      <!-- Right eyebrow -->
      <path id="mascot-brow-r" d="M 55 35 Q 63 34 71 35" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Cute beak -->
    <g id="mascot-beak-group">
      <polygon id="mascot-beak" points="50,52 44,59 56,59" fill="#f59e0b" />
      <!-- Happy open mouth / smile (for celebration) -->
      <path id="mascot-mouth-open" d="M 46 59 Q 50 64 54 59 Z" fill="#ef4444" style="display:none;" />
    </g>

    <!-- Left Wing -->
    <path id="mascot-wing-left" d="M 24 56 C 18 60, 14 68, 18 76 C 24 76, 26 66, 26 58 Z" fill="#1d4ed8" />

    <!-- Right Wing (pointing wing default) -->
    <path id="mascot-wing-right" d="M 76 56 C 84 52, 94 48, 98 44 C 95 54, 88 64, 76 68 Z" fill="#1d4ed8" />

    <!-- Small feet -->
    <ellipse id="mascot-foot-l" cx="40" cy="90" rx="6" ry="3" fill="#f59e0b" />
    <ellipse id="mascot-foot-r" cx="60" cy="90" rx="6" ry="3" fill="#f59e0b" />

    <!-- Confused question mark accessory (revealed in confused state) -->
    <g id="mascot-confused-mark" style="display:none;">
      <text x="73" y="32" font-size="16" font-family="sans-serif" font-weight="bold" fill="#f59e0b">?</text>
    </g>

    <!-- Thinking bulb/sparkle accessory (revealed in thinking state) -->
    <g id="mascot-thinking-mark" style="display:none;">
      <circle cx="76" cy="26" r="5" fill="#fde047" stroke="#eab308" stroke-width="1.2" />
      <path d="M 74 31 L 78 31" stroke="#ca8a04" stroke-width="1.2" />
    </g>
  </g>
</svg>
