<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft shadow -->
    <filter id="mascot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Mascot Body (Friendly owl / bird shape) -->
  <g filter="url(#mascot-shadow)">
    <!-- Main round body -->
    <ellipse cx="50" cy="54" rx="34" ry="36" fill="url(#bodyGrad)" />
    
    <!-- Ears / crest -->
    <polygon points="26,24 38,34 22,38" fill="#1d4ed8" />
    <polygon points="74,24 78,38 62,34" fill="#1d4ed8" />

    <!-- Belly -->
    <ellipse cx="50" cy="62" rx="22" ry="24" fill="url(#bellyGrad)" />

    <!-- Large friendly eyes -->
    <!-- Left eye outer -->
    <circle cx="37" cy="46" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Left pupil -->
    <circle cx="39" cy="46" r="5.5" fill="#1e293b" />
    <!-- Left eye shine -->
    <circle cx="41" cy="43.5" r="2" fill="#ffffff" />

    <!-- Right eye outer -->
    <circle cx="63" cy="46" r="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Right pupil -->
    <circle cx="65" cy="46" r="5.5" fill="#1e293b" />
    <!-- Right eye shine -->
    <circle cx="67" cy="43.5" r="2" fill="#ffffff" />

    <!-- Cute beak -->
    <polygon points="50,52 44,59 56,59" fill="#f59e0b" />

    <!-- Pointing Right Wing -->
    <path id="mascot-wing-right" d="M 76 56 C 84 52, 94 48, 98 44 C 95 54, 88 64, 76 68 Z" fill="#1d4ed8" />

    <!-- Left resting wing -->
    <path id="mascot-wing-left" d="M 24 56 C 18 60, 14 68, 18 76 C 24 76, 26 66, 26 58 Z" fill="#1d4ed8" />

    <!-- Small feet -->
    <ellipse cx="40" cy="90" rx="6" ry="3" fill="#f59e0b" />
    <ellipse cx="60" cy="90" rx="6" ry="3" fill="#f59e0b" />
  </g>
</svg>
